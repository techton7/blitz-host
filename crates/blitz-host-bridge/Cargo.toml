[package]
name = "blitz-host-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Runtime host bridge connecting live Blitz DOM and Winit to blitz-host"

[dependencies]
blitz-host-protocol = { version = "0.3.0", path = "../blitz-host-protocol" }
