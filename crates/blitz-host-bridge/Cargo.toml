[package]
name = "blitz-host-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Runtime host bridge connecting live Blitz DOM and Winit to blitz-host"

[dependencies]
blitz-host-protocol = { version = "0.3.9", path = "../blitz-host-protocol" }
blitz-host-transport = { version = "0.3.9", path = "../blitz-host-transport" }
blitz-dom = { git = "https://github.com/techton7/blitz.git", tag = "techton-main-v0.3.10", default-features = false }
blitz-paint = { git = "https://github.com/techton7/blitz.git", tag = "techton-main-v0.3.10", default-features = false, features = ["svg"] }
anyrender = "0.15.0"
anyrender_vello_cpu = "0.19.0"
peniko = "0.6.0"
png = "0.17"

[dev-dependencies]
blitz-traits = { git = "https://github.com/techton7/blitz.git", tag = "techton-main-v0.3.10", default-features = false }
