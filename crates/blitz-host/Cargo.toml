[package]
name = "blitz-host"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Canonical facade, CLI, and host control plane for live Blitz desktop applications"

[dependencies]
blitz-host-protocol = { version = "0.3.0", path = "../blitz-host-protocol" }
blitz-host-transport = { version = "0.3.0", path = "../blitz-host-transport" }
blitz-host-bridge = { version = "0.3.0", path = "../blitz-host-bridge" }
blitz-dom = { git = "https://github.com/techton7/blitz.git", tag = "techton-main-v0.3.0", default-features = false }
blitz-traits = { git = "https://github.com/techton7/blitz.git", tag = "techton-main-v0.3.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Optional Dioxus Native integration
dioxus = { version = "0.8.0-alpha.3", default-features = false, features = ["hooks", "signals", "macro", "html"], optional = true }
dioxus-core = { version = "0.8.0-alpha.3", optional = true }
dioxus-native = { git = "https://github.com/techton7/blitz.git", tag = "techton-main-v0.3.0", optional = true, features = ["prelude"] }
keyboard-types = { version = "0.8", optional = true }

[features]
default = []
dioxus-native = ["dep:dioxus", "dep:dioxus-core", "dep:dioxus-native", "dep:keyboard-types"]

[[bin]]
name = "blitz-host"
path = "src/bin/blitz-host.rs"
