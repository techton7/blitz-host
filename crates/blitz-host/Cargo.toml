[package]
name = "blitz-host"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Canonical facade, CLI, and host control plane for live Blitz desktop applications"

[dependencies]
blitz-host-protocol = { version = "0.1.3", path = "../blitz-host-protocol" }
blitz-host-transport = { version = "0.1.3", path = "../blitz-host-transport" }
blitz-host-bridge = { version = "0.1.3", path = "../blitz-host-bridge" }
blitz-dom = { git = "https://github.com/techton7/blitz.git", tag = "v0.3.0-alpha.2", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Optional Dioxus Native integration
dioxus = { version = "0.7.10", default-features = false, features = ["hooks", "signals", "macro", "html"], optional = true }
dioxus-native = { git = "https://github.com/techton7/blitz.git", tag = "v0.3.0-alpha.2", optional = true }
keyboard-types = { version = "0.7", optional = true }

[features]
default = []
dioxus-native = ["dep:dioxus", "dep:dioxus-native", "dep:keyboard-types"]

[[bin]]
name = "blitz-host"
path = "src/bin/blitz-host.rs"
