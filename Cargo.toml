[workspace]
resolver = "2"
members = [
    "crates/blitz-host-protocol",
    "crates/blitz-host-transport",
    "crates/blitz-host-bridge",
    "crates/blitz-host",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Techton <contact@techton.io>"]
repository = "https://github.com/techton7/blitz-host"
homepage = "https://github.com/techton7/blitz-host"

[patch."https://github.com/techton7/blitz.git"]
dioxus-native = { path = "../../blitz/packages/dioxus-native" }
dioxus-native-dom = { path = "../../blitz/packages/dioxus-native-dom" }
blitz-shell = { path = "../../blitz/packages/blitz-shell" }
blitz-dom = { path = "../../blitz/packages/blitz-dom" }
blitz-traits = { path = "../../blitz/packages/blitz-traits" }
blitz-paint = { path = "../../blitz/packages/blitz-paint" }

[patch.crates-io]
blitz-shell = { path = "../../blitz/packages/blitz-shell" }
blitz-dom = { path = "../../blitz/packages/blitz-dom" }
blitz-traits = { path = "../../blitz/packages/blitz-traits" }
blitz-paint = { path = "../../blitz/packages/blitz-paint" }
