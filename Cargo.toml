[workspace]
resolver = "2"
members = [
    "crates/blitz-host-protocol",
    "crates/blitz-host-transport",
    "crates/blitz-host-bridge",
    "crates/blitz-host",
]

[workspace.package]
version = "0.1.4"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Techton <contact@techton.io>"]
repository = "https://github.com/techton7/blitz-host"
homepage = "https://github.com/techton7/blitz-host"

[patch.crates-io]
blitz-shell = { git = "https://github.com/techton7/blitz.git", tag = "techton-main-v0.1.0" }
blitz-dom = { git = "https://github.com/techton7/blitz.git", tag = "techton-main-v0.1.0" }
blitz-traits = { git = "https://github.com/techton7/blitz.git", tag = "techton-main-v0.1.0" }
blitz-paint = { git = "https://github.com/techton7/blitz.git", tag = "techton-main-v0.1.0" }
wgpu_context = { git = "https://github.com/techton7/anyrender", tag = "wgpu_context-v0.9.1-win-policy" }



